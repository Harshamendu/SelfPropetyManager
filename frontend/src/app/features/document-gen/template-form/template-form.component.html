<div class="form-container">
  <h1>{{ isEditMode ? 'Edit Template' : 'Create Template' }}</h1>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Template Name</mat-label>
          <input matInput formControlName="name">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="2"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Template Content</mat-label>
          <textarea matInput formControlName="template_body" rows="12" placeholder="Use curly braces for variable placeholders"></textarea>
          <mat-hint>Use double curly braces for variables, e.g. {{ '{{tenant_name}}' }}</mat-hint>
        </mat-form-field>

        <div class="variables-section mt-3">
          <div class="variables-header">
            <h3>Variables</h3>
            <button mat-stroked-button type="button" (click)="addVariable()">
              <mat-icon>add</mat-icon> Add Variable
            </button>
          </div>

          @for (variable of variablesArray.controls; track $index; let i = $index) {
            <div class="variable-row" [formGroupName]="i">
              <mat-form-field appearance="outline">
                <mat-label>Variable Name</mat-label>
                <input matInput formControlName="name" placeholder="e.g., tenant_name">
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Label</mat-label>
                <input matInput formControlName="label" placeholder="e.g., Tenant Name">
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>Default Value</mat-label>
                <input matInput formControlName="default_value">
              </mat-form-field>

              <button mat-icon-button color="warn" type="button" (click)="removeVariable(i)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          }
        </div>

        <div class="form-actions mt-3">
          <button mat-button type="button" (click)="cancel()">Cancel</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
            {{ isEditMode ? 'Update' : 'Create' }} Template
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
