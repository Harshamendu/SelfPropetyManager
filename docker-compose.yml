version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-propmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-propmanager}
      POSTGRES_DB: ${DB_NAME:-propmanager}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-propmanager}"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-propmanager}:${DB_PASSWORD:-propmanager}@db:5432/${DB_NAME:-propmanager}"
      SYNC_DATABASE_URL: "postgresql://${DB_USER:-propmanager}:${DB_PASSWORD:-propmanager}@db:5432/${DB_NAME:-propmanager}"
      DOCUMENT_STORAGE_PATH: /data/documents
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${DOCUMENT_HOST_PATH:-./documents}:/data/documents
      - ./backend/alembic/versions:/app/alembic/versions
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
